<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ParK — Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#00A68F">

<!-- ZXing : indispensable pour iOS (pas de BarcodeDetector sur Safari) -->
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>
  :root{
    --tq:#00A68F; --tq-d:#008A76; --tq-l:#e0f5f1;
    --red:#F24438; --red-bg:#ffeae8; --red-txt:#c62828;
    --or:#F88223; --g100:#f8f8f8; --g200:#eee; --g300:#ddd; --g500:#888;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    background:#0d0f12; color:#fff; display:flex; flex-direction:column;
    overscroll-behavior:none;
  }
  header{
    background:var(--tq); padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-shrink:0;
  }
  .h-t{font-size:16px;font-weight:900}
  .h-s{font-size:11px;font-weight:600;opacity:.85}
  .h-btn{
    background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;
    padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
    font-family:inherit;white-space:nowrap;
  }

  .modes{display:flex;gap:8px;padding:10px;flex-shrink:0;background:#15181c}
  .mode{
    flex:1;padding:14px 6px;border-radius:12px;border:2.5px solid #2b3038;background:#1c2026;
    color:#7b828c;font-size:15px;font-weight:900;text-align:center;cursor:pointer;
    font-family:inherit;-webkit-tap-highlight-color:transparent;transition:.15s;
  }
  .mode .i{display:block;font-size:24px;margin-bottom:2px}
  .mode.on-in{border-color:var(--tq);background:var(--tq);color:#fff}
  .mode.on-out{border-color:var(--red);background:var(--red);color:#fff}

  #stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
  #vid{width:100%;height:100%;object-fit:cover;display:block}
  .frame{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:84%;height:30%;border:3px solid rgba(255,255,255,.95);border-radius:12px;
    box-shadow:0 0 0 2000px rgba(0,0,0,.45);pointer-events:none;
  }
  .laser{
    position:absolute;left:0;right:0;height:2px;background:#ff3b30;
    box-shadow:0 0 8px #ff3b30;top:50%;animation:sweep 1.6s ease-in-out infinite;
  }
  @keyframes sweep{0%,100%{top:12%}50%{top:88%}}
  .tip{
    position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:0;right:0;
    text-align:center;font-size:13px;font-weight:700;text-shadow:0 1px 4px #000;pointer-events:none;
  }
  .torch{
    position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;
    background:rgba(0,0,0,.55);border:none;color:#fff;font-size:20px;cursor:pointer;display:none;
  }
  .torch.show{display:block}
  .torch.on{background:#ffd54f;color:#000}

  #overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    padding:18px;background:rgba(10,12,15,.94);z-index:10;
  }
  #overlay.show{display:flex}
  .card{
    width:100%;max-width:420px;border-radius:16px;padding:24px 18px;text-align:center;
    animation:pop .22s ease;
  }
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .card.ok-in{background:var(--tq-l);border:3px solid var(--tq);color:#083}
  .card.ok-out{background:var(--red-bg);border:3px solid #ef9a9a;color:#600}
  .card.warn{background:#fff3e0;border:3px solid var(--or);color:#7a3b00}
  .card.err{background:var(--red-bg);border:3px solid var(--red);color:var(--red-txt)}
  .c-route{font-size:16px;font-weight:800;color:#333;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:900;padding:3px 8px;border-radius:6px;background:#e3e3e3;color:#444}
  .tag.LAVL{background:#d9ecff;color:#14538a}
  .tag.MONT{background:#f2e4ff;color:#5b2b86}
  .c-place{font-size:64px;font-weight:900;line-height:1;margin:10px 0;letter-spacing:1px}
  .c-place.in{color:var(--tq-d)} .c-place.out{color:var(--red-txt)}
  .c-msg{font-size:15px;font-weight:700;color:#333}
  .c-sub{font-size:12.5px;color:#666;margin-top:8px}
  .c-next{
    margin-top:18px;width:100%;padding:15px;border:none;border-radius:12px;
    background:#111;color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;
  }

  #manual{padding:10px;background:#15181c;flex-shrink:0;display:flex;gap:8px}
  #manual input{
    flex:1;padding:12px;border-radius:10px;border:2px solid #2b3038;background:#1c2026;
    color:#fff;font-size:16px;font-weight:700;text-align:center;font-family:monospace;
    letter-spacing:1px;text-transform:uppercase;
  }
  #manual input:focus{outline:none;border-color:var(--tq)}
  #manual button{
    padding:0 18px;border:none;border-radius:10px;background:var(--tq);color:#fff;
    font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;
  }

  #hist{background:#0d0f12;max-height:24vh;overflow-y:auto;padding:0 10px 10px;flex-shrink:0}
  .h-row{
    display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1c2026;
    border-radius:8px;margin-bottom:5px;font-size:13px;
  }
  .h-b{font-size:10px;font-weight:900;padding:2px 7px;border-radius:5px}
  .h-in{background:var(--tq-l);color:var(--tq-d)}
  .h-out{background:var(--red-bg);color:var(--red-txt)}
  .h-er{background:#fff3e0;color:#e65100}
  .h-r{flex:1;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .h-p{font-weight:900;color:#4dd0c4}
  .h-tm{font-size:11px;color:#666}

  #setup{
    position:fixed;inset:0;background:#0d0f12;z-index:50;padding:24px 18px;
    display:none;flex-direction:column;justify-content:center;
  }
  #setup.show{display:flex}
  #setup h2{font-size:18px;margin-bottom:8px}
  #setup p{font-size:13px;color:#9aa2ad;margin-bottom:16px;line-height:1.5}
  #setup input{
    width:100%;padding:12px;border-radius:10px;border:2px solid #2b3038;
    background:#1c2026;color:#fff;font-size:13px;margin-bottom:10px;font-family:monospace;
  }
  #setup button{
    width:100%;padding:14px;border:none;border-radius:10px;background:var(--tq);
    color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:#000;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    opacity:0;transition:.3s;pointer-events:none;z-index:100;border:1px solid #333;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>

<div id="setup">
  <h2>⚙️ Configuration</h2>
  <p>Colle l'URL de ton application ParK (celle qui finit par <b>/exec</b>) et la clé donnée par <b>setScanKey()</b>.</p>
  <input id="su-url" placeholder="https://script.google.com/macros/s/.../exec">
  <input id="su-key" placeholder="Clé scanner">
  <button onclick="saveSetup()">Enregistrer</button>
</div>

<div class="toast" id="toast"></div>

<header>
  <div>
    <div class="h-t">🚚 ParK — Scanner</div>
    <div class="h-s" id="sub">Connexion…</div>
  </div>
  <button class="h-btn" onclick="openSetup()">⚙️</button>
</header>

<div class="modes">
  <div class="mode on-in" id="m-in" onclick="setMode('IN')"><span class="i">🚚</span>CHECK IN</div>
  <div class="mode" id="m-out" onclick="setMode('OUT')"><span class="i">🏁</span>CHECK OUT</div>
</div>

<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <div class="frame"><div class="laser"></div></div>
  <div class="tip" id="tip">Vise le code-barres</div>
  <button class="torch" id="torch" onclick="toggleTorch()">🔦</button>
  <div id="overlay"><div id="card"></div></div>
</div>

<div id="manual">
  <input id="mi" placeholder="Code manuel..." autocomplete="off"
    onkeydown="if(event.key==='Enter'){event.preventDefault();send(this.value);this.value='';}">
  <button onclick="var e=document.getElementById('mi');send(e.value);e.value='';">OK</button>
</div>

<div id="hist"></div>

<script>
/* ══════════ CONFIG ══════════ */
var API='', KEY='', mode='IN';

(function init(){
  var h=location.hash.replace(/^#/,'');
  var q={};
  h.split('&').forEach(function(kv){
    var i=kv.indexOf('=');
    if(i>0) q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));
  });
  API=q.u||localStorage.getItem('park_api')||'';
  KEY=q.k||localStorage.getItem('park_key')||'';
  if(q.u) localStorage.setItem('park_api',q.u);
  if(q.k) localStorage.setItem('park_key',q.k);
  if(!API||!KEY){ openSetup(); return; }
  ping();
})();

function openSetup(){
  document.getElementById('su-url').value=API;
  document.getElementById('su-key').value=KEY;
  document.getElementById('setup').classList.add('show');
  stopCam();
}
function saveSetup(){
  API=document.getElementById('su-url').value.trim();
  KEY=document.getElementById('su-key').value.trim();
  if(!API||!KEY){ toast('Remplis les deux champs'); return; }
  localStorage.setItem('park_api',API);
  localStorage.setItem('park_key',KEY);
  document.getElementById('setup').classList.remove('show');
  ping();
}

/* ══════════ JSONP (aucun souci de CORS) ══════════ */
function jsonp(params){
  return new Promise(function(resolve,reject){
    var cb='pk'+Date.now()+Math.floor(Math.random()*10000);
    var s=document.createElement('script');
    var to=setTimeout(function(){ done(); reject(new Error('Délai dépassé')); },25000);
    function done(){
      clearTimeout(to);
      try{ delete window[cb]; }catch(_){ window[cb]=undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb]=function(d){ done(); resolve(d); };
    s.onerror=function(){ done(); reject(new Error('Réseau / URL invalide')); };
    var qs=Object.keys(params).map(function(k){
      return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);
    }).join('&');
    s.src=API+(API.indexOf('?')>-1?'&':'?')+qs+'&k='+encodeURIComponent(KEY)+'&callback='+cb;
    document.head.appendChild(s);
  });
}

function ping(){
  document.getElementById('sub').textContent='Connexion…';
  jsonp({api:'ping'}).then(function(d){
    if(d&&d.ok){
      document.getElementById('sub').textContent=d.station||'Connecté';
      startCam();
    } else {
      document.getElementById('sub').textContent=(d&&d.msg)||'Erreur';
      toast((d&&d.msg)||'Erreur de connexion');
      openSetup();
    }
  }).catch(function(e){
    document.getElementById('sub').textContent='Hors ligne';
    toast('❌ '+e.message);
    openSetup();
  });
}

function setMode(m){
  mode=m;
  document.getElementById('m-in').className='mode'+(m==='IN'?' on-in':'');
  document.getElementById('m-out').className='mode'+(m==='OUT'?' on-out':'');
}

/* ══════════ CAMÉRA + DÉTECTION ══════════ */
var stream=null, video=null, detector=null, raf=null, scanning=false;
var zxReader=null, zxControls=null, track=null, torchOn=false;
var lastVal='', lastTs=0;

function hasBD(){ return ('BarcodeDetector' in window); }

function makeBD(){
  if(!hasBD()) return Promise.resolve(null);
  var want=['code_128','code_39','code_93','codabar','ean_13','ean_8','upc_a','upc_e','itf','qr_code'];
  return BarcodeDetector.getSupportedFormats().then(function(sup){
    var f=want.filter(function(x){return sup.indexOf(x)!==-1;});
    try{ return new BarcodeDetector(f.length?{formats:f}:undefined); }catch(_){ return null; }
  }).catch(function(){ try{ return new BarcodeDetector(); }catch(_){ return null; } });
}

function startCam(){
  if(scanning) return;
  video=document.getElementById('vid');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('❌ Caméra non supportée'); return;
  }
  navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st;
    track=st.getVideoTracks()[0];
    // autofocus continu + torche si dispo
    try{
      var cap=track.getCapabilities?track.getCapabilities():{};
      var adv=[];
      if(cap.focusMode&&cap.focusMode.indexOf('continuous')!==-1) adv.push({focusMode:'continuous'});
      if(adv.length) track.applyConstraints({advanced:adv});
      if(cap.torch) document.getElementById('torch').classList.add('show');
    }catch(_){}
    return video.play();
  }).then(function(){
    scanning=true;
    return makeBD();
  }).then(function(d){
    detector=d;
    if(d){ tick(); document.getElementById('tip').textContent='Vise le code-barres'; }
    else  { startZXing(); }
  }).catch(function(e){
    toast('❌ Caméra refusée : '+(e.name||e.message));
    document.getElementById('tip').textContent='Autorise la caméra puis touche ⚙️ → Enregistrer';
  });
}

/* ── Boucle BarcodeDetector : on décode la zone du cadre (bien meilleur sur les 1D) ── */
var cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
var altFull=false;

function tick(){
  if(!scanning||!detector||!video||video.readyState<2){
    raf=requestAnimationFrame(tick); return;
  }
  var vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh){ raf=requestAnimationFrame(tick); return; }

  var src;
  altFull=!altFull;
  if(altFull){
    src=video;                       // 1 image sur 2 : plein cadre
  } else {
    var cw=Math.round(vw*0.88), ch=Math.round(vh*0.40);
    var sx=Math.round((vw-cw)/2), sy=Math.round((vh-ch)/2);
    var sc=Math.min(2, 1280/Math.max(1,cw));
    cv.width=Math.round(cw*sc); cv.height=Math.round(ch*sc);
    cx.filter='grayscale(1) contrast(1.5)';
    cx.drawImage(video,sx,sy,cw,ch,0,0,cv.width,cv.height);
    src=cv;                          // 1 image sur 2 : zone du cadre, agrandie
  }

  detector.detect(src).then(function(codes){
    if(codes&&codes.length&&codes[0].rawValue) onDetected(codes[0].rawValue);
    else raf=requestAnimationFrame(tick);
  }).catch(function(){ raf=requestAnimationFrame(tick); });
}

/* ── Repli ZXing : iOS Safari et navigateurs sans BarcodeDetector ── */
function startZXing(){
  var B=(window.ZXingBrowser&&window.ZXingBrowser.BrowserMultiFormatReader)
      || (window.ZXing&&window.ZXing.BrowserMultiFormatReader);
  if(!B){ toast('❌ Décodeur non chargé'); return; }
  document.getElementById('tip').textContent='Vise le code-barres (mode compatible)';
  try{
    var hints=null;
    if(window.ZXing&&ZXing.DecodeHintType&&ZXing.BarcodeFormat){
      hints=new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.CODE_93,  ZXing.BarcodeFormat.CODABAR,
        ZXing.BarcodeFormat.EAN_13,   ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A,    ZXing.BarcodeFormat.ITF,
        ZXing.BarcodeFormat.QR_CODE
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    }
    zxReader=new B(hints,{delayBetweenScanAttempts:120});
    zxReader.decodeFromVideoElement(video,function(res){
      if(res){ onDetected(res.getText?res.getText():res.text); }
    }).then(function(c){ zxControls=c; }).catch(function(){});
  }catch(e){ toast('❌ '+e.message); }
}

function onDetected(val){
  if(!val) return;
  var now=Date.now();
  if(val===lastVal && (now-lastTs)<3000) return;
  lastVal=val; lastTs=now;
  beep(true); vib(70);
  stopCam();                 // ← la caméra se ferme toute seule
  send(val);                 // ← puis on traite automatiquement
}

function stopCam(){
  scanning=false;
  if(raf){ cancelAnimationFrame(raf); raf=null; }
  if(zxControls){ try{ zxControls.stop(); }catch(_){} zxControls=null; }
  if(zxReader){ try{ zxReader.reset&&zxReader.reset(); }catch(_){} zxReader=null; }
  if(stream){ stream.getTracks().forEach(function(t){ try{t.stop();}catch(_){}}); stream=null; }
  track=null; torchOn=false;
  document.getElementById('torch').classList.remove('show','on');
}

function toggleTorch(){
  if(!track) return;
  torchOn=!torchOn;
  track.applyConstraints({advanced:[{torch:torchOn}]})
    .then(function(){ document.getElementById('torch').classList.toggle('on',torchOn); })
    .catch(function(){ toast('Torche indisponible'); });
}

/* ══════════ ENVOI + RÉSULTAT ══════════ */
var hist=[], busy=false;

function send(raw){
  var code=(raw||'').toString().trim().toUpperCase();
  if(!code) { startCam(); return; }
  if(busy) return;
  busy=true;
  showCard({loading:true, code:code});

  jsonp({api:'scan', code:code, action:mode})
    .then(function(res){
      busy=false;
      showCard(res, code);
      if(res&&res.ok){ beep(true); vib(60); } else { beep(false); vib([80,60,80]); }
      pushHist(res, code);
    })
    .catch(function(e){
      busy=false;
      var r={ok:false,msg:'❌ '+e.message};
      showCard(r, code); beep(false); pushHist(r, code);
    });
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tagHtml(t){ return t?'<span class="tag '+esc(t)+'">'+esc(t)+'</span>':''; }
function durTxt(m){ if(m<60) return m+' min'; var h=Math.floor(m/60),r=m%60; return r?h+'h'+('0'+r).slice(-2):h+'h'; }

function showCard(res, code){
  var ov=document.getElementById('overlay'), c=document.getElementById('card');
  ov.classList.add('show');

  if(res&&res.loading){
    c.className='card warn';
    c.innerHTML='<div class="c-msg">⏳ Traitement…</div><div class="c-sub">'+esc(code)+'</div>';
    return;
  }
  var cls = (!res||!res.ok) ? 'err' : (res.warn ? 'warn' : (res.action==='OUT'?'ok-out':'ok-in'));
  c.className='card '+cls;

  var h='';
  if(res&&res.ok){
    h+='<div class="c-route">'+tagHtml(res.tag)+esc(res.route)
     + (res.idc?'<span style="color:#777;font-weight:600;font-size:12px">'+esc(res.idc)+'</span>':'')+'</div>';
    if(res.place) h+='<div class="c-place '+(res.action==='OUT'?'out':'in')+'">'+esc(res.place)+'</div>';
    h+='<div class="c-msg">'+esc(res.msg)+'</div>';
    if(res.action==='IN'&&res.zone) h+='<div class="c-sub">Zone : '+esc(res.zone)+'</div>';
    if(res.action==='OUT'&&res.loadOut) h+='<div class="c-sub">Load out : '+durTxt(res.loadOut)+'</div>';
  } else {
    h+='<div class="c-place err" style="font-size:44px">⚠️</div>';
    h+='<div class="c-msg">'+esc(res?res.msg:'Erreur')+'</div>';
    h+='<div class="c-sub">Code : '+esc(code)+'</div>';
  }
  h+='<button class="c-next" onclick="nextScan()">📷 Scanner le suivant</button>';
  c.innerHTML=h;
}

function nextScan(){
  document.getElementById('overlay').classList.remove('show');
  lastVal=''; lastTs=0;
  startCam();
}

function pushHist(res, code){
  var t=new Date();
  hist.unshift({
    ok:!!(res&&res.ok), action:(res&&res.action)||mode,
    route:(res&&res.route)||code, tag:res?res.tag:'', place:(res&&res.place)||'',
    time:('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)
  });
  if(hist.length>15) hist.pop();
  var el=document.getElementById('hist'), h='';
  for(var i=0;i<hist.length;i++){
    var x=hist[i];
    var b=!x.ok?'h-er':(x.action==='OUT'?'h-out':'h-in');
    var l=!x.ok?'!':(x.action==='OUT'?'OUT':'IN');
    h+='<div class="h-row"><span class="h-b '+b+'">'+l+'</span>'
     + '<span class="h-r">'+tagHtml(x.tag)+esc(x.route)+'</span>'
     + (x.place?'<span class="h-p">'+esc(x.place)+'</span>':'')
     + '<span class="h-tm">'+x.time+'</span></div>';
  }
  el.innerHTML=h;
}

/* ══════════ Utilitaires ══════════ */
function beep(good){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    var a=new C(), o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination); o.type='square';
    o.frequency.value=good?900:220; g.gain.value=.07; o.start();
    setTimeout(function(){ o.stop(); a.close(); }, good?110:260);
  }catch(_){}
}
function vib(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(_){} }
function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },2600);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden) stopCam();
  else if(!document.getElementById('overlay').classList.contains('show')
       && !document.getElementById('setup').classList.contains('show')
       && API && KEY) startCam();
});
</script>
